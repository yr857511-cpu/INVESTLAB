name: 시장 데이터 미러 갱신

# INVEST LAB 대시보드가 매번 브라우저에서 직접 부르던 미국금리·환율·지수/원자재/VIX·코인
# 데이터를, 여기(GitHub Actions)에서 15분마다 대신 받아와 data/market-data.json으로
# 저장하고 GitHub Pages로 함께 배포한다. 대시보드 쪽은 이 파일이 없거나 오래됐거나
# 형식이 이상해도 자동으로 기존 방식(Cloudflare 백엔드 → CORS 프록시)으로 넘어가도록
# 되어 있으므로, 이 워크플로가 실패해도 대시보드가 더 나빠지지는 않는다.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 시장 데이터 받아오기
        run: node scripts/fetch-market-data.mjs data/market-data.json

      - name: 변경 있으면 커밋 & 푸시
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-data.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 시장 데이터 미러 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
